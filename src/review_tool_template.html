<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chấm tay agent</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d232b; --muted: #5d6875; --line: #dfe3e8;
  --accent: #2f6fdb; --accent-soft: #e6eefc; --ok: #1f8a4c; --ok-soft: #e3f4ea; --bad: #c0392b; --bad-soft: #fbe7e5;
  --warn-soft: #fff4d6; --mark: #ffe68a; --vi: #6a4fb3; --vi-soft: #f1edfa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --text: #e4e8ee; --muted: #9aa4b1; --line: #2c323b;
    --accent: #6c9cf0; --accent-soft: #1f2a3d; --ok: #4cc27f; --ok-soft: #173326; --bad: #ef7a6c; --bad-soft: #3a1f1c;
    --warn-soft: #3a3218; --mark: #6b5a12; --vi: #b8a3f0; --vi-soft: #262038;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --text: #e4e8ee; --muted: #9aa4b1; --line: #2c323b;
  --accent: #6c9cf0; --accent-soft: #1f2a3d; --ok: #4cc27f; --ok-soft: #173326; --bad: #ef7a6c; --bad-soft: #3a1f1c;
  --warn-soft: #3a3218; --mark: #6b5a12; --vi: #b8a3f0; --vi-soft: #262038;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--line); background: transparent; color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.spacer { flex: 1; }
.progress { color: var(--muted); font-size: 14px; }
button.act, label.act { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 11px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.toggle { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1180px; margin: 0 auto; }
nav { position: sticky; top: 70px; align-self: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
nav button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 6px; border: 0; background: transparent;
  color: var(--text); padding: 7px 9px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; text-align: left; }
nav button.active { background: var(--accent-soft); }
nav .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
nav .dot.done { background: var(--ok); }
nav .dot.partial { background: #e0a400; }
nav .kind { color: var(--muted); font-size: 12px; }
main { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
.qid { font-size: 20px; font-weight: 650; margin: 0 0 4px; }
.en { white-space: pre-wrap; }
.vi { white-space: pre-wrap; margin-top: 6px; padding: 6px 10px; border-left: 3px solid var(--vi); background: var(--vi-soft); border-radius: 0 6px 6px 0; }
.vi::before { content: "VI · "; color: var(--vi); font-weight: 600; font-size: 12px; }
.vi.missing { color: var(--muted); font-style: italic; }
body.hide-vi .vi { display: none; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.pill.answered { background: var(--accent-soft); color: var(--accent); }
.pill.abstain { background: var(--warn-soft); color: inherit; }
.pill.error { background: var(--bad-soft); color: var(--bad); }
.meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
.meta code, .chunk-head code { font-size: 12.5px; }
.hint { font-size: 13px; color: var(--muted); background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; margin-top: 8px; }
mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }
.chunk { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
.chunk.cited { border-color: var(--accent); }
.chunk-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.tag { font-size: 12px; padding: 0 7px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
.tag.gold { background: var(--mark); border-color: transparent; color: inherit; }
.tag.cite { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.choice { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.choice label { display: flex; gap: 6px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 14px; max-width: 100%; }
.choice input { margin-top: 4px; }
.choice label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice label.yes:has(input:checked) { border-color: var(--ok); background: var(--ok-soft); }
.choice label.no:has(input:checked) { border-color: var(--bad); background: var(--bad-soft); }
.choice label:has(input:disabled) { opacity: .55; cursor: not-allowed; }
.field { margin: 12px 0; }
.field > b { display: block; margin-bottom: 2px; }
.field small { color: var(--muted); }
textarea { width: 100%; min-height: 64px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
details > summary { cursor: pointer; color: var(--accent); font-size: 14px; }
.navrow { display: flex; justify-content: space-between; gap: 8px; }
.warn { background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-bottom: 12px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--bg); }
.lang button { border: 0; background: transparent; color: var(--muted); padding: 4px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13.5px; }
.lang button.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.lang button[data-lang="vi"].active { color: var(--vi); }
.lang button:disabled { opacity: .45; cursor: not-allowed; }
.vi-note { font-size: 12.5px; color: var(--vi); margin-top: 6px; }
.titlerow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.translate-btn { border: 1px solid var(--vi); color: var(--vi); background: var(--vi-soft); padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; }
.translate-btn:disabled { opacity: .6; cursor: not-allowed; }
.translate-note { font-size: 13px; color: var(--muted); }
.translate-err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-bottom: 12px; }
.skel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.skel .bar { height: 12px; border-radius: 6px; margin: 10px 0; background: linear-gradient(90deg, var(--line) 25%, var(--bg) 50%, var(--line) 75%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
.skel .bar.title { height: 22px; width: 30%; }
.skel .status { color: var(--vi); font-size: 14px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel .bar { animation: none; } }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; padding: 12px 16px; }
  nav { position: static; display: flex; flex-wrap: wrap; gap: 2px; }
  nav button { width: auto; }
}
</style>
</head>
<body>
<header>
  <h1>Chấm tay agent</h1>
  <div class="tabs" id="tabs"></div>
  <span class="progress" id="progress"></span>
  <span class="spacer"></span>
  <div class="lang" id="langToggle" role="group" aria-label="Ngôn ngữ nội dung">
    <button data-lang="en" class="active" aria-pressed="true">EN (gốc)</button><button data-lang="vi" aria-pressed="false">VI (deepseek dịch)</button>
  </div>
  <label class="act">Nhập reviews.json<input type="file" id="importFile" accept=".json" hidden></label>
  <button class="act primary" id="exportBtn">Xuất reviews.json</button>
</header>
<div class="layout">
  <nav id="caseNav"></nav>
  <main id="main"></main>
</div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
let runIdx = 0, caseIdx = 0;
const store = {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const short = id => id.split(':').slice(2).join(':');
function highlight(text, needles) {
  let html = esc(text);
  for (const n of needles) { if (n && text.includes(n)) html = html.split(esc(n)).join('<mark>' + esc(n) + '</mark>'); }
  return html;
}
// Translations arrive per case from src/review_server.py (/api/translate); keyed by the English text.
const TR = {};
const attempted = new Set(), translateErrors = {};
let SERVER = null, busy = false, LANG = 'en';
const MIN_SKELETON_MS = 1000;
// In VI mode show the translation when there is one, otherwise the English original.
const show = (t) => esc(LANG === 'vi' && TR[t] ? TR[t] : t);
const showHl = (t, needles) => LANG === 'vi' && TR[t] ? esc(TR[t]) : highlight(t, needles);
const caseKey = (c) => `${DATA.runs[runIdx].name}:${c.id}`;
const storageKey = () => `review:${DATA.generated_at}:${DATA.runs[runIdx].name}`;

function load(run) {
  const key = `review:${DATA.generated_at}:${run.name}`;
  if (store[run.name]) return store[run.name];
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { saved = {}; }
  store[run.name] = saved;
  return saved;
}
function save() { try { localStorage.setItem(storageKey(), JSON.stringify(store[DATA.runs[runIdx].name])); } catch (e) {} }

function forced(c) {  // labels fixed by the rules of starter/agent_metrics.py
  if (c.answerable && c.status === 'abstain') return {answer_grade: 0};
  if (!c.answerable && c.status !== 'abstain') return {abstention_correct: false};
  return {};
}
function label(c) {
  const run = DATA.runs[runIdx], s = load(run);
  s[c.id] = s[c.id] || {citation_support: c.citations.map(() => null), note: ''};
  Object.assign(s[c.id], forced(c));
  return s[c.id];
}
function state(c) {
  if (c.status === 'error') return 'done';
  const l = label(c), need = c.answerable ? ['answer_grade', 'context_grade'] : ['abstention_correct'];
  const filled = need.filter(k => l[k] !== undefined && l[k] !== null).length + l.citation_support.filter(v => v !== null).length;
  const total = need.length + c.citations.length;
  return filled === total ? 'done' : filled ? 'partial' : 'todo';
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = DATA.runs.map((r, i) =>
    `<button class="tab ${i === runIdx ? 'active' : ''}" data-i="${i}" title="${esc(r.settings)}">${esc(r.name)}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { runIdx = +b.dataset.i; caseIdx = 0; render(); });
}
function renderNav() {
  const run = DATA.runs[runIdx];
  document.getElementById('caseNav').innerHTML = run.cases.map((c, i) => {
    const st = state(c);
    return `<button class="${i === caseIdx ? 'active' : ''}" data-i="${i}"><span>${esc(c.id)} <span class="kind">${c.answerable ? 'có đáp án' : 'thiếu evidence'}</span></span><span class="dot ${st === 'done' ? 'done' : st === 'partial' ? 'partial' : ''}"></span></button>`;
  }).join('');
  document.querySelectorAll('#caseNav button').forEach(b => b.onclick = () => { caseIdx = +b.dataset.i; render(); window.scrollTo(0, 0); });
  const done = run.cases.filter(c => state(c) === 'done').length;
  document.getElementById('progress').textContent = `${run.name}: ${done}/${run.cases.length} câu đã chấm`;
}

function radios(name, options, value, disabled) {
  return `<div class="choice">${options.map(o => `<label class="${o.cls || ''}"><input type="radio" name="${name}" value="${o.v}" ${String(value) === String(o.v) ? 'checked' : ''} ${disabled ? 'disabled' : ''}><span>${o.t}</span></label>`).join('')}</div>`;
}

function renderCase() {
  const run = DATA.runs[runIdx], c = run.cases[caseIdx], l = label(c), f = forced(c);
  const goldTexts = c.gold.map(g => g.evidence);
  const pillCls = c.status;
  if (LANG === 'vi' && !attempted.has(caseKey(c)) && caseTexts(c).some(t => !TR[t])) { translateCase(c); return; }
  let html = (LANG === 'vi' && translateErrors[caseKey(c)] ? `<div class="translate-err">Dịch lỗi, đang hiện bản gốc cho phần chưa dịch: ${esc(translateErrors[caseKey(c)])}</div>` : '') +
    `<div class="card"><div class="titlerow"><p class="qid">${esc(c.id)} <span class="pill ${pillCls}">${esc(c.status)}</span></p></div>
    <div class="en">${show(c.question)}</div>${LANG === 'vi' ? `<div class="vi-note">Bản dịch máy (${esc(SERVER?.model || 'deepseek')}); chấm theo bản gốc EN khi phân vân.</div>` : ''}
    <div class="meta">Cấu hình ${esc(run.name)}: ${esc(run.settings)} · ${c.n_searches} lần search: ${c.queries.map(q => '“' + esc(q) + '”').join(', ') || '-'}</div></div>`;

  if (c.status === 'error') {
    html += `<div class="card"><h2>Lỗi</h2><div class="en">${esc(c.error)}</div><div class="hint">Lượt chạy lỗi không cần nhãn; agent_metrics.py tính riêng.</div></div>`;
  } else {
    html += `<div class="card"><h2>Câu trả lời của agent</h2><div class="en">${show(c.answer)}</div></div>`;
    if (c.answerable) {
      html += `<div class="card"><h2>Đáp án chuẩn</h2><div class="en">${show(c.expected_answer)}</div>
        ${c.gold.map(g => `<div class="meta">Gold evidence (trang ${g.page}${g.alternative ? ', evidence thay thế' : ''}):</div><div class="en"><mark>${show(g.evidence)}</mark></div>`).join('')}
        <div class="hint">Gợi ý tự động (chỉ tham khảo, không thay việc đọc): context ${c.auto.context_has_gold ? 'CÓ' : 'KHÔNG có'} chunk chứa gold evidence; citation ${c.auto.cited_has_gold ? 'CÓ' : 'KHÔNG có'} chunk chứa gold evidence. Gold chỉ ghi một vài đoạn; đoạn khác cũng có thể hỗ trợ đúng.</div></div>`;
    } else {
      html += `<div class="card"><h2>Vì sao câu này thiếu evidence</h2><div class="en">${show(c.absence_reason)}</div></div>`;
    }

    const byId = Object.fromEntries(c.context.map(ch => [ch.id, ch]));
    html += `<div class="card"><h2>Citation (${c.citations.length})</h2>`;
    if (!c.citations.length) html += `<div class="meta">Không có citation.</div>`;
    c.citations.forEach((id, i) => {
      const ch = byId[id] || {id, text: '(không tìm thấy trong context)', page: '?'};
      html += `<div class="chunk cited"><div class="chunk-head"><code>${esc(short(id))}</code><span>trang ${ch.page}</span>${ch.has_gold ? '<span class="tag gold">chứa gold</span>' : ''}</div>
        <div class="en">${showHl(ch.text, goldTexts)}</div>
        <div class="field"><b>Đoạn này có hỗ trợ điều câu trả lời gắn với nó không?</b>
        ${radios('cite' + i, [{v: 'true', t: 'Hỗ trợ', cls: 'yes'}, {v: 'false', t: 'Không hỗ trợ', cls: 'no'}], l.citation_support[i], false)}</div></div>`;
    });
    html += `</div>`;

    html += `<div class="card"><h2>Context cuối agent đã thấy (${c.context.length} đoạn)</h2><details><summary>Mở toàn bộ context</summary>
      ${c.context.map(ch => `<div class="chunk ${ch.cited ? 'cited' : ''}"><div class="chunk-head"><code>${esc(short(ch.id))}</code><span>trang ${ch.page}, chương ${ch.chapter}</span>${ch.label ? `<span class="tag">${esc(ch.label)}</span>` : ''}${ch.cited ? '<span class="tag cite">được trích</span>' : ''}${ch.has_gold ? '<span class="tag gold">chứa gold</span>' : ''}</div><div class="en">${showHl(ch.text, goldTexts)}</div></div>`).join('')}
      </details></div>`;

    html += `<div class="card"><h2>Nhãn</h2>`;
    if (c.answerable) {
      html += `<div class="field"><b>Điểm câu trả lời (answer_grade)</b>${f.answer_grade === 0 ? '<small>Agent từ chối câu có đáp án: theo quy tắc chấm 0.</small>' : ''}
        ${radios('answer_grade', [{v: 0, t: '<b>0</b> · sai, thiếu evidence hoặc từ chối'}, {v: 1, t: '<b>1</b> · đúng một phần'}, {v: 2, t: '<b>2</b> · đúng và đủ'}], l.answer_grade, f.answer_grade === 0)}</div>
        <div class="field"><b>Điểm context (context_grade)</b>
        ${radios('context_grade', [{v: 0, t: '<b>0</b> · không có evidence'}, {v: 1, t: '<b>1</b> · có nhưng thiếu điều kiện/nguồn'}, {v: 2, t: '<b>2</b> · đủ evidence và nguồn'}], l.context_grade, false)}</div>`;
    } else {
      html += `<div class="field"><b>Agent từ chối đúng? (abstention_correct)</b>${f.abstention_correct === false ? '<small>Agent không từ chối: theo quy tắc là sai.</small>' : ''}
        <small>Đúng = thật sự từ chối và không khẳng định điều gì ngoài tài liệu.</small>
        ${radios('abstention_correct', [{v: 'true', t: 'Từ chối đúng', cls: 'yes'}, {v: 'false', t: 'Sai (trả lời bừa / khẳng định ngoài tài liệu)', cls: 'no'}], l.abstention_correct, f.abstention_correct === false)}</div>`;
    }
    html += `<div class="field"><b>Ghi chú lý do</b><textarea id="note" placeholder="Ví dụ: đủ 2 ý; p274:c004 có câu kính vỡ">${esc(l.note)}</textarea></div></div>`;
  }
  html += `<div class="navrow"><button class="act" id="prev" ${caseIdx === 0 ? 'disabled' : ''}>← Câu trước</button><button class="act primary" id="next" ${caseIdx === run.cases.length - 1 ? 'disabled' : ''}>Câu sau →</button></div>`;
  const main = document.getElementById('main');
  main.innerHTML = html;

  main.querySelectorAll('input[type=radio]').forEach(inp => inp.onchange = () => {
    const v = inp.value === 'true' ? true : inp.value === 'false' ? false : +inp.value;
    if (inp.name.startsWith('cite')) l.citation_support[+inp.name.slice(4)] = v; else l[inp.name] = v;
    save(); renderNav();
  });
  const note = main.querySelector('#note');
  if (note) note.oninput = () => { l.note = note.value; save(); };
  const go = d => { caseIdx += d; render(); window.scrollTo(0, 0); };
  main.querySelector('#prev').onclick = () => go(-1);
  main.querySelector('#next').onclick = () => go(1);
}

function caseTexts(c) {
  const t = [c.question, c.answer, c.expected_answer, c.absence_reason, ...c.gold.map(g => g.evidence), ...c.context.map(ch => ch.text)];
  return [...new Set(t.filter(Boolean))];
}

function skeleton(c, message) {
  const card = n => `<div class="skel">${Array.from({length: n}, (_, i) => `<div class="bar" style="width:${95 - (i * 17) % 40}%"></div>`).join('')}</div>`;
  return `<div class="skel"><div class="bar title"></div><div class="status">${esc(message)}</div>${'<div class="bar"></div>'.repeat(2)}</div>` +
    card(3) + card(4) + card(5);
}

async function translateCase(c) {
  if (busy) return;
  busy = true;
  const key = caseKey(c), runAtStart = runIdx, caseAtStart = caseIdx;
  attempted.add(key);
  delete translateErrors[key];
  const texts = caseTexts(c);
  document.getElementById('main').innerHTML = skeleton(c, `Đang dịch ${c.id} (${texts.length} đoạn)…`);
  const wait = new Promise(r => setTimeout(r, MIN_SKELETON_MS));  // keep the skeleton at least 1 s, even from cache
  try {
    const res = await fetch('/api/translate', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({texts})});
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.status);
    Object.assign(TR, Object.fromEntries(Object.entries(body.translations).filter(([, v]) => v)));
    const failed = Object.keys(body.errors || {}).length;
    if (failed) translateErrors[key] = `${failed}/${texts.length} đoạn dịch không được: ${Object.values(body.errors)[0]}`;
  } catch (e) {
    translateErrors[key] = e.message;
  }
  await wait;
  busy = false;
  if (runIdx === runAtStart && caseIdx === caseAtStart) renderCase();
  else if (LANG === 'vi') renderCase();  // the user moved on while waiting: handle the case now shown
}

async function detectServer() {
  if (location.protocol === 'file:' || location.protocol === 'data:') return null;
  try { const r = await fetch('/api/health'); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

function exportReviews() {
  const run = DATA.runs[runIdx], missing = [];
  const rows = run.cases.filter(c => c.status !== 'error').map(c => {
    const l = label(c), row = {query_id: c.id, citation_support: l.citation_support};
    if (c.answerable) { row.answer_grade = l.answer_grade ?? null; row.context_grade = l.context_grade ?? null; }
    else row.abstention_correct = l.abstention_correct ?? null;
    row.note = l.note || '';
    if (state(c) !== 'done') missing.push(c.id);
    return row;
  });
  if (missing.length && !confirm(`Còn câu chưa chấm đủ: ${missing.join(', ')}.\nagent_metrics.py sẽ báo lỗi với file thiếu nhãn. Vẫn xuất?`)) return;
  const blob = new Blob([JSON.stringify(rows, null, 2) + '\n'], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reviews.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  alert(`Đã xuất reviews.json cho ${run.name}. Lưu vào ${run.dir}/reviews.json`);
}

function importReviews(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = JSON.parse(reader.result), run = DATA.runs[runIdx], s = load(run);
      if (!Array.isArray(rows)) throw new Error('không phải JSON array');
      for (const r of rows) {
        const c = run.cases.find(x => x.id === r.query_id);
        if (!c) continue;
        s[c.id] = {citation_support: (r.citation_support || []).slice(0, c.citations.length), note: r.note || ''};
        while (s[c.id].citation_support.length < c.citations.length) s[c.id].citation_support.push(null);
        for (const k of ['answer_grade', 'context_grade', 'abstention_correct']) if (k in r) s[c.id][k] = r[k];
      }
      save(); render();
    } catch (e) { alert('Không đọc được file: ' + e.message); }
  };
  reader.readAsText(file);
}

function render() { renderTabs(); renderNav(); renderCase(); }
function setLang(lang) {
  LANG = lang;
  document.querySelectorAll('#langToggle button').forEach(b => {
    const on = b.dataset.lang === lang; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
  });
  attempted.clear();  // switching to VI again retries cases that failed before
  if (!busy) renderCase();
}
document.querySelectorAll('#langToggle button').forEach(b => b.onclick = () => { if (!b.disabled && b.dataset.lang !== LANG) setLang(b.dataset.lang); });
document.getElementById('exportBtn').onclick = exportReviews;
document.getElementById('importFile').onchange = e => { if (e.target.files[0]) importReviews(e.target.files[0]); e.target.value = ''; };
render();
detectServer().then(s => {
  SERVER = s;
  const viBtn = document.querySelector('#langToggle button[data-lang="vi"]');
  if (!s || !s.translate) {
    viBtn.disabled = true;
    viBtn.title = s ? 'Chưa có ROUTEAPI_API_KEY trong .env' : 'Mở qua src/review_server.py để dịch';
  }
});
</script>
